services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Создайте .env по образцу .env.example}
      MYSQL_DATABASE: cats_db
      MYSQL_USER: cat_app
      MYSQL_PASSWORD: ${DB_PASS:?Создайте .env по образцу .env.example}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/structure.sql:/docker-entrypoint-initdb.d/01-structure.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./docker/mysql/init-test-database.sql:/docker-entrypoint-initdb.d/03-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: cats_db
      DB_USER: cat_app
      DB_PASS: ${DB_PASS:?Создайте .env по образцу .env.example}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

  tests:
    profiles: ["tests"]
    build:
      context: .
      target: tests
    environment:
      DB_HOST: db
      DB_NAME: cats_db_test
      DB_USER: cat_app
      DB_PASS: ${DB_PASS:?Создайте .env по образцу .env.example}
      TEST_DB_NAME: cats_db_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
